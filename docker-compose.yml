services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: crypto-monitor-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Berlin
      - TZ=Europe/Berlin
    volumes:
      - crypto_monitor_n8n_data:/home/node/.n8n

volumes:
  crypto_monitor_n8n_data: